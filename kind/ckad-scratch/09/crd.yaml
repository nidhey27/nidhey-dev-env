apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workshops.training.example.com
spec:
  group: training.example.com
  scope: Namespaced
  names:
    plural: workshops
    shortNames: 
    - ws
    singular: workshop
    kind: Workshop
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              topic:
                type: string
              trainer:
                type: string
              seats:
                type: integer
                minimum: 1
                maximum: 50
